; BIoT - PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Root PlatformIO configuration
[platformio]
; Build only the primary (release) environment by default. Invoke `pio run -e BIoT_debug` for debug.
default_envs = BIoT

[env:BIoT]
platform = espressif32
framework = arduino
board = esp32-s2-saola-1

; Build type
build_type = release

; Libraries (keep as in your current file)
lib_deps =
  SPI
  OneWire
  DallasTemperature
  RTClib
  SdFat
  bogde/HX711
  LoRa
  GxEPD2
  Adafruit GFX Library
  Adafruit BusIO
  Adafruit NeoPixel
  SD

; Library dependency finder - safer, more permissive
lib_ldf_mode = deep+

; Serial monitor
monitor_speed = 115200

; Upload settings (override per-machine by setting COM_PORT env variable)
upload_protocol = esptool
; Use a system environment variable COM_PORT if defined, otherwise PlatformIO will attempt auto-detection.
; Correct syntax for system environment variable expansion is ${sysenv.NAME}
upload_port = ${sysenv.COM_PORT}
upload_speed = 921600
; (Optional) Additional upload flags can be set here, left intentionally empty previously which may confuse some parsers.
; upload_flags =

; Run the project pre-build versioning script automatically
; (PlatformIO runs this script before compiling)
extra_scripts = pre:buildscript_versioning.py

; Debugging
debug_tool = esp-prog
debug_init_break = tbreak setup
; Additional debug-specific flags can be set in debug env below

[env:BIoT_debug]
; Same board/SDK but debug-friendly build flags and symbols
platform = espressif32
framework = arduino
board = esp32-s2-saola-1

build_type = debug
monitor_speed = 115200

; Use the same libs & LDF; you can keep or override them here if desired
lib_deps =
  SPI
  OneWire
  DallasTemperature
  RTClib
  SdFat
  bogde/HX711
  LoRa
  GxEPD2
  Adafruit GFX Library
  Adafruit BusIO
  Adafruit NeoPixel
  SD

lib_ldf_mode = deep+

; Upload settings for debug env (same defaults)
upload_protocol = esptool
upload_port = ${sysenv.COM_PORT}
upload_speed = 115200

; Debug flags - preserve your existing debug flags
; these ensure symbols and gdb-friendly output
debug_tool = esp-prog
debug_build_flags = -DBIoTDBG -O0 -ggdb3 -g3
build_flags = -DBIoTDBG

; Optional: if you want the pre-build script in debug builds too
extra_scripts = pre:buildscript_versioning.py

