; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = BIoT

[env:BIoT]
platform = espressif32
framework = arduino
board = esp32-s2-saola-1
build_type = release
lib_deps = 
	SPI
	OneWire
	DallasTemperature
	RTClib
	SdFat
	bogde/HX711
	LoRa
	GxEPD2
	Adafruit GFX Library
	Adafruit BusIO
	Adafruit NeoPixel
	SD
	rei-vilo/PDLS_Common@^10.0.8
	pervasivedisplays/Pervasive_Wide_Small@^9.0.5
lib_ldf_mode = deep+
monitor_speed = 115200
build_flags = 
  -DDEBUG_BAUDRATE=115200
upload_protocol = esptool
upload_port = COM10
upload_speed = 921600
extra_scripts = pre:buildscript_versioning.py
debug_tool = esp-prog
debug_init_break = tbreak setup

[env:BIoT_debug]
platform = espressif32
framework = arduino
board = esp32-s2-saola-1
build_type = debug
monitor_speed = 115200
build_flags = 
  -DDEBUG_BAUDRATE=115200
  -DBIoTDBG
lib_deps = 
	SPI
	OneWire
	DallasTemperature
	RTClib
	SdFat
	bogde/HX711
	LoRa
	GxEPD2
	Adafruit GFX Library
	Adafruit BusIO
	Adafruit NeoPixel
	SD
	rei-vilo/PDLS_Common@^10.0.8
	pervasivedisplays/Pervasive_Wide_Small@^9.0.5
lib_ldf_mode = deep+
upload_protocol = esptool
upload_port = COM10
upload_speed = 115200
debug_build_flags = 
  -DBIoTDBG
  -O0 
  -ggdb3
  -g3
debug_tool = esp-prog
debug_init_break = tbreak setup
;debug_load_mode = always
